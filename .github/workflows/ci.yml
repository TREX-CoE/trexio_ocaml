name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The vendored release tarball ships its own configure + libtool, so
      # build-essential + pkg-config is enough.
      - name: Install build tools and HDF5
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libhdf5-dev

      # Build the pinned (vendored) C library into /usr: this leg
      # exercises the "system C library preferred" path.
      - name: Build and install the TREXIO C library
        run: |
          sudo ./setup.sh install-c-library /usr
          sudo ldconfig
          pkg-config --modversion trexio

      # OCaml in a fresh switch. A full in-tree `opam install .` breaks
      # dune (setup-ocaml nests the opam root in the workspace, opam 2.6.1).
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      # Installs the binding's dependencies (dune, dune-configurator,
      # conf-pkg-config); the C library is the system one built above.
      - name: Install dependency packages
        run: opam install . --deps-only --with-test -y

      - name: Build, install and test the binding with dune
        run: |
          opam exec -- dune build @install
          opam exec -- dune install
          opam exec -- dune build @runtest --verbose

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dune-logs
          path: _build/
          retention-days: 7

  # Bootstrap leg: NO TREXIO on the machine. The record's build: stanza
  # bootstraps the vendored tarball into _c-prefix (offline, static); its
  # install: stanza is exercised by opam-repository CI.
  build-and-test-bootstrap:
    name: Build & Test (no system C lib - bootstrap, ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and HDF5 (NO TREXIO C library)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libhdf5-dev

      - name: "Guard: this leg must start without any TREXIO"
        run: |
          if pkg-config --exists trexio; then
            echo "ERROR: trexio is installed - bootstrap leg invalid" >&2
            exit 1
          fi

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      # Toolchain only — no C-library package is involved: the binding
      # bootstraps the C library from its own vendored tarball.
      - name: Install the toolchain
        run: opam install dune dune-configurator conf-pkg-config --with-test -y

      # discover.ml prefers a system library (API floor checked), then
      # finds the ./_c-prefix installed by the step above.
      - name: "Bootstrap the C library (the record's build: stanza, verbatim)"
        run: |
          sh -c 'pkg-config --atleast-version=2.6.1 trexio || \
                 ./setup.sh install-c-library "$(pwd)/_c-prefix"'

      - name: Build, install and test the binding with dune
        run: |
          opam exec -- dune build @install
          opam exec -- dune install
          opam exec -- dune build @runtest --verbose

      - name: Verify the bootstrap produced a static C library
        run: |
          test -f _c-prefix/lib/libtrexio.a
          test -z "$(ls _c-prefix/lib | grep '^libtrexio\.so' || true)"
          test -f _c-prefix/lib/pkgconfig/trexio.pc
          grep -q "_c-prefix/lib" _build/default/lib/c_library_flags.sexp
          echo "OK: static bootstrapped C library in _c-prefix, used by the in-tree build"

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dune-logs-bootstrap
          path: _build/
          retention-days: 7

  # Cheap guard: all declared versions agree.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check dune-project and trexio.opam agree and follow the convention
        run: |
          set -e
          PV=$(sed -n 's/.*version \([0-9.][0-9.]*\).*/\1/p' dune-project | head -1)
          PATCH=$(echo "$PV" | cut -d. -f3)
          [ "$PATCH" -ge 100 ] || { echo "patch component must be 3 digits (2.6.1NN), got $PV"; exit 1; }
          grep -q "version: \"${PV}\"" trexio.opam || { echo "trexio.opam"; exit 1; }
          echo "versions OK: $PV (C library = $PV with last two digits ignored)"

  # Non-blocking reminder when a new C release appears upstream.
  watch-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compare C library version with latest TREXIO release
        run: |
          LATEST=$(curl -fsSL https://api.github.com/repos/TREX-CoE/trexio/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4 | sed 's/^v//')
          PV=$(sed -n 's/.*version \([0-9.][0-9.]*\).*/\1/p' dune-project | head -1)
          Pinned="$(echo "$PV" | cut -d. -f1).$(echo "$PV" | cut -d. -f2).$(($(echo "$PV" | cut -d. -f3) / 100))"
          echo "pinned C=$Pinned, latest C=$LATEST"
          if [ "$LATEST" != "$Pinned" ]; then
            echo "::warning::TREXIO released v$LATEST; binding is built against v$Pinned.
            Bump the dune-project version (C patch digit), rebuild and re-run tests."
          fi
