name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The vendored release tarball ships its own configure + libtool, so
      # build-essential + pkg-config is enough (no autotools packages).
      - name: Install build tools and HDF5
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libhdf5-dev

      # Build the TREXIO C library from the pinned (vendored) release into
      # /usr/local — this leg exercises the "system C library preferred"
      # path of the in-tree build.
      - name: Build and install the TREXIO C library
        run: |
          sudo ./setup.sh install-c-library /usr/local
          sudo ldconfig
          pkg-config --modversion trexio

      # OCaml in a fresh switch. The deps are installed via
      # `opam install . --deps-only` (runs the conf-trexio C-library check)
      # and the binding is then built + tested in-tree: a full in-tree
      # `opam install .` does not work, because setup-ocaml nests its opam
      # root inside the workspace and that breaks dune (opam 2.6.1).
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      # Runs the conf-trexio build step (pkg-config check); installs dune,
      # dune-configurator, conf-pkg-config.
      - name: Install dependency packages
        run: opam install . --deps-only --with-test -y

      # Build, install into the switch, and run the test suite (in-tree).
      - name: Build, install and test the binding with dune
        run: |
          opam exec -- dune build @install
          opam exec -- dune install
          opam exec -- dune build @runtest --verbose

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dune-logs
          path: _build/
          retention-days: 7

  # ---------------------------------------------------------------
  # Bootstrap leg: the machine has NO TREXIO C library. conf-trexio must
  # then compile the vendored external/trexio-<V>.tar.gz statically
  # (build: stanza; the tarball is self-contained) and install it into
  # the switch (install: stanza); the binding must build + test against
  # it, found via the discover.ml switch fallback.
  # ---------------------------------------------------------------
  build-and-test-bootstrap:
    name: Build & Test (no system C lib - bootstrap, ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and HDF5 (NO TREXIO C library)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libhdf5-dev

      - name: "Guard: this leg must start without any TREXIO"
        run: |
          if pkg-config --exists trexio; then
            echo "ERROR: trexio is installed - bootstrap leg invalid" >&2
            exit 1
          fi

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      # Install the pinned conf-trexio BY NAME (setup-ocaml pins it as
      # `conf-trexio.dev`): `opam install . --deps-only` would skip it —
      # every .opam record in the worktree is a "project" package and
      # --deps-only never builds project packages, so the bootstrap would
      # not run. dune + dune-configurator are listed explicitly: a conf
      # package brings no OCaml toolchain, and the in-tree build needs it.
      - name: Install conf-trexio (bootstraps the C library into the switch)
        run: opam install conf-trexio.dev dune dune-configurator --with-test -y

      # discover.ml resolves the C library via pkg-config, falling back to
      # <switch>/lib/pkgconfig/trexio.pc.
      - name: Build, install and test the binding with dune
        run: |
          opam exec -- dune build @install
          opam exec -- dune install
          opam exec -- dune build @runtest --verbose

      - name: Verify the bootstrap installed a static C library into the switch
        run: |
          opam exec -- sh -c '
            P="$(ocamlc -where | sed "s|/lib/ocaml$||")"
            ls "$P/lib" | grep -x libtrexio.a
            test -z "$(ls "$P/lib" | grep "^libtrexio\.so" || true)"
            test -f "$P/lib/pkgconfig/trexio.pc"
            grep -q "$P/lib" _build/default/lib/c_library_flags.sexp
            echo "OK: static bootstrap C library in the switch ($P), used by the in-tree build"
          '

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dune-logs-bootstrap
          path: _build/
          retention-days: 7

  # -----------------------------------------
  # Cheap guard: all declared versions agree
  # -----------------------------------------
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check dune-project / trexio.opam / conf-trexio.opam agree and follow the convention
        run: |
          set -e
          PV=$(sed -n 's/.*version \([0-9.][0-9.]*\).*/\1/p' dune-project | head -1)
          PATCH=$(echo "$PV" | cut -d. -f3)
          [ "$PATCH" -ge 100 ] || { echo "patch component must be 3 digits (2.6.1NN), got $PV"; exit 1; }
          grep -q "version: \"${PV}\"" trexio.opam  || { echo "trexio.opam";    exit 1; }
          grep -q "version: \"${PV}\"" conf-trexio.opam \
                                             || { echo "conf-trexio.opam"; exit 1; }
          echo "all versions = $PV (C library = $PV with last two digits ignored)"

  # ----------------------------------------
  # Non-blocking reminder when a new release
  # of the C library appears upstream
  # ----------------------------------------
  watch-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compare C library version with latest TREXIO release
        run: |
          LATEST=$(curl -fsSL https://api.github.com/repos/TREX-CoE/trexio/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4 | sed 's/^v//')
          PV=$(sed -n 's/.*version \([0-9.][0-9.]*\).*/\1/p' dune-project | head -1)
          Pinned="$(echo "$PV" | cut -d. -f1).$(echo "$PV" | cut -d. -f2).$(($(echo "$PV" | cut -d. -f3) / 100))"
          echo "pinned C=$Pinned, latest C=$LATEST"
          if [ "$LATEST" != "$Pinned" ]; then
            echo "::warning::TREXIO released v$LATEST; binding is built against v$Pinned.
            Bump the dune-project version (C patch digit), rebuild and re-run tests."
          fi
